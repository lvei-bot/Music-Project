:root{
  --canvas:#F3F3F1;--surface:#F8F8F6;--paper:#FFFFFF;--ink:#111111;--muted:#5F5F5D;--line:#C9C9C5;
  --accent:#FF4B30;--accent-hover:#E73C23;--inverse:#FFFFFF;--success:#236E50;--error:#A32922;
  --pad:clamp(16px,4vw,72px);--content-max:1440px;
  --display:"Grotesk","Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",system-ui,sans-serif;
  --body:"Manrope","Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",system-ui,sans-serif;
  --top-h:76px;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--canvas);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:var(--canvas);font-family:var(--body);font-size:1rem;line-height:1.5;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.accent-panel button:focus-visible,.on-accent :focus-visible{outline-color:var(--ink)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:12px 16px;z-index:100}
.skip:focus{top:8px}

/* type */
.display{font-family:var(--display);font-weight:700;letter-spacing:-.06em;line-height:.88;margin:0}
.micro{font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.acc{font-size:.58em;vertical-align:.42em;letter-spacing:0;font-weight:700;margin-left:.04em}
.rn sup{font-size:.5em;letter-spacing:0;vertical-align:.7em;margin-left:.05em}
.vert{writing-mode:vertical-rl;transform:rotate(180deg)}

/* top bar */
.top{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--pad);min-height:var(--top-h);max-width:var(--content-max);margin-inline:auto}
.top .ngrp{display:flex;align-items:center;gap:clamp(18px,3vw,44px)}
.mark{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.06em;min-height:44px;display:inline-flex;align-items:center;margin-right:clamp(0px,2vw,24px)}
.nl{min-height:44px;display:inline-flex;align-items:center;gap:8px;position:relative}
.nl::before{content:"";width:8px;height:8px;background:var(--accent);opacity:0;transform:scale(.4);transition:all .15s}
.nl[aria-current="page"]::before{opacity:1;transform:none}
.nl:hover{text-decoration:underline;text-underline-offset:6px}
.menu-btn{display:none;width:44px;height:44px;align-items:center;justify-content:center}
.menu-btn i{display:block;width:24px;height:2px;background:var(--ink);position:relative}
.menu-btn i::before,.menu-btn i::after{content:"";position:absolute;left:0;width:24px;height:2px;background:var(--ink)}
.menu-btn i::before{top:-7px}.menu-btn i::after{top:7px}
.sheet{position:fixed;inset:0;z-index:60;background:var(--canvas);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) var(--pad) calc(24px + env(safe-area-inset-bottom))}
.sheet .row-top{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.sheet nav{display:flex;flex-direction:column;margin-top:24px;border-top:1px solid var(--ink)}
.sheet nav button{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,11vw,3.6rem);letter-spacing:-.05em;line-height:1;padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;min-height:64px}
.sheet nav button .micro{letter-spacing:.12em}

main{max-width:var(--content-max);margin-inline:auto;outline:none}
.view{animation:enter .26s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:20px;min-height:52px;padding:0 20px;background:var(--ink);color:#fff;font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;transition:transform .15s,background .15s}
.btn:hover{transform:translate(2px,-2px)}
.btn.acc-bg{background:var(--accent);color:var(--ink)}
.btn.acc-bg:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.big{min-height:72px;font-size:.95rem;padding:0 28px}
.sq{width:56px;height:56px;background:var(--ink);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;transition:transform .15s}
.sq:hover{transform:translate(2px,-2px)}

/* HOME */
.hero{position:relative;overflow:hidden;min-height:clamp(560px,calc(100dvh - var(--top-h)),860px)}
.hero .stage{position:absolute;inset:0}
.hero .wordmark{position:absolute;left:var(--pad);top:15%;font-size:clamp(6rem,17vw,16.5rem);z-index:3}
.hero .acc-block{position:absolute;left:44%;right:0;top:46%;height:34%;background:var(--accent);z-index:1}
.hero .art{position:absolute;left:58%;width:26%;top:4%;height:104%;z-index:2;mix-blend-mode:multiply;pointer-events:none}
.hero .art svg{width:100%;height:100%}
.hero .acc-block .go{position:absolute;left:0;bottom:0}
.hero .vtext{position:absolute;right:calc(var(--pad) - 6px);top:11%;z-index:3;display:flex;gap:10px;align-items:flex-start}
.hero .vtext .vert{font-family:var(--display);font-weight:700;font-size:clamp(1rem,1.6vw,1.5rem);letter-spacing:-.02em;line-height:1.05;text-transform:uppercase}
.hero .vtext i{width:2px;height:92px;background:var(--ink)}
.hero .blurb{position:absolute;left:var(--pad);top:62%;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:min(34%,460px)}
.hero .blurb .micro{font-size:.68rem;line-height:1.6}
.hero .num{position:absolute;left:var(--pad);bottom:40px;z-index:3;font-family:var(--display);font-weight:700;font-size:6.2rem;line-height:.8;letter-spacing:-.08em;writing-mode:vertical-rl;transform:rotate(180deg) scaleX(.78);transform-origin:center}
.hero .actions{position:absolute;left:calc(var(--pad) + 100px);bottom:40px;z-index:4;display:flex;flex-direction:column;gap:0;width:min(30vw,420px)}
.act{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;border-top:1px solid var(--ink);padding:10px 0;font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;transition:padding .15s}
.act:last-child{border-bottom:1px solid var(--ink)}
.act:hover{padding-left:10px;background:var(--surface)}
.act small{display:block;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:none;font-size:.78rem;margin-top:2px}
.rows{padding:clamp(40px,8vw,120px) var(--pad) clamp(60px,8vw,120px);display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px}
.rows .lead{grid-column:1/5}
.rows .list{grid-column:5/13}
.rrow{display:grid;grid-template-columns:90px 1fr 1.4fr 44px;gap:20px;align-items:baseline;border-top:1px solid var(--ink);padding:26px 0;text-align:left;width:100%;transition:background .15s,padding .15s}
.rrow:last-child{border-bottom:1px solid var(--ink)}
.rrow:hover{background:var(--surface);padding-left:12px}
.rrow .t{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,3.4vw,3.2rem);letter-spacing:-.05em;line-height:1}
.rrow p{margin:0;color:var(--muted);font-size:.95rem;max-width:44ch}
.foot{padding:28px var(--pad) calc(40px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line)}

/* CONFIG */
.cfg{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:clamp(12px,3vw,40px) var(--pad) 160px}
.cfg-head{grid-column:1/5;position:sticky;top:12px;align-self:start}
.cfg-head h1{font-size:clamp(3rem,5.4vw,6.2rem);margin:18px 0 28px;overflow-wrap:break-word}
.cfg-sum{border-top:1px solid var(--ink)}
.cfg-sum div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}
.cfg-sum b{font-weight:800;text-align:right}
.start{display:flex;justify-content:space-between;align-items:flex-end;width:100%;min-height:150px;margin-top:28px;padding:18px 20px;background:var(--accent);color:var(--ink);transition:background .15s,transform .15s;text-align:left}
.start:hover{background:var(--accent-hover);transform:translate(3px,-3px)}
.start .big{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,2.6vw,2.6rem);letter-spacing:-.05em;line-height:.95}
.start[disabled]{background:var(--line);pointer-events:none;color:var(--muted)}
.start-wrap{margin-top:0}
.warn{margin-top:12px;color:var(--error);font-weight:800;min-height:1.5em}
.cfg-body{grid-column:5/13}
.grp{border-top:2px solid var(--ink)}
.grp:last-child{border-bottom:2px solid var(--ink)}
.grp-h{display:grid;grid-template-columns:56px 1fr auto 32px;gap:12px;align-items:center;width:100%;min-height:72px;padding:12px 0}
.grp-h .t{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,2.2vw,2rem);letter-spacing:-.04em;line-height:1;text-transform:uppercase}
.grp-h .v{text-align:right;max-width:34ch}
.grp-h .pm{font-size:1.5rem;font-weight:300;text-align:right}
.grp-c{padding:4px 0 32px 68px}
.setting{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px 24px;padding:18px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.setting .lab{padding-top:10px}
.setting .lab small{display:block;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:.8rem;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{min-height:48px;min-width:48px;padding:0 18px;border:1px solid var(--ink);margin:0 -1px -1px 0;font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:background .12s}
.seg button:hover{background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button[aria-pressed="true"]::before{content:"■";font-size:.6rem;color:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:0}
.keys button{min-height:58px;border:1px solid var(--ink);margin:0 -1px -1px 0;font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:-.04em;display:flex;align-items:center;justify-content:center;transition:background .12s}
.keys button:hover{background:var(--paper)}
.keys button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:inset 0 -6px 0 var(--accent)}
.keys button.rnd{grid-column:span 2;font-size:.78rem;font-family:var(--body);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.degs{display:grid;grid-template-columns:repeat(7,1fr);gap:0}
.degs button{min-height:76px;border:1px solid var(--ink);margin:0 -1px -1px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;transition:background .12s}
.degs button:hover{background:var(--paper)}
.degs .r{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.04em}
.degs .c{font-size:.74rem;font-weight:700;color:inherit;opacity:.8}
.degs button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:inset 0 -5px 0 var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--ink)}
.stepper button{width:48px;height:48px;font-size:1.3rem;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--ink);color:#fff}
.stepper output{min-width:76px;text-align:center;font-weight:800;border-inline:1px solid var(--ink);line-height:48px;font-variant-numeric:tabular-nums}

/* SESSION shared */
.sess{padding:0 var(--pad) 40px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:1px solid var(--ink);padding:14px 0}
.meta div b{display:block;font-size:.98rem;font-weight:800;letter-spacing:0;text-transform:none;margin-top:2px}
.pbar{height:6px;background:var(--line);position:relative;margin:0}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0}
.s-main{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;min-height:clamp(420px,58dvh,640px);position:relative}
.s-left{grid-column:1/8;grid-row:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,4vw,48px) 0;position:relative;z-index:2;min-width:0}
.chord{font-size:clamp(4.2rem,11.5vw,11.5rem);overflow-wrap:anywhere;line-height:.92}
.chord.long{font-size:clamp(3.4rem,8.2vw,8.2rem)}
.roman{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.6vw,4.4rem);letter-spacing:-.05em;margin-top:18px;line-height:1}
.notes-line{margin-top:20px;display:flex;flex-wrap:wrap;gap:0}
.notes-line span{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.03em;border:1px solid var(--ink);margin:0 -1px -1px 0;min-width:64px;height:56px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.notes-line span.bass{background:var(--ink);color:#fff}
.s-right{grid-column:7/13;grid-row:1;position:relative;align-self:stretch;min-height:320px}
.s-right .acc-block{position:absolute;left:12%;right:calc(-1 * var(--pad));top:22%;bottom:12%;background:var(--accent)}
.s-right .piano{position:absolute;left:0;right:0;top:14%;bottom:auto;z-index:2}
.s-right .piano svg{display:block;width:100%;height:auto}
.s-right .cover{position:absolute;left:12%;right:calc(-1 * var(--pad));top:22%;bottom:12%;display:flex;align-items:center;justify-content:center;z-index:2}
.s-right .cover button{background:var(--ink);color:#fff;min-height:56px;padding:0 24px}
.vlab{position:absolute;right:calc(-1 * var(--pad) + 10px);top:0;z-index:3}
.bar{display:grid;grid-template-columns:1fr 1fr 2fr;gap:0;border-top:1px solid var(--ink);margin-top:0}
.bar .b{min-height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:800;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;border-right:1px solid var(--ink);transition:background .15s}
.bar .b:hover{background:var(--surface)}
.bar .b[disabled]{opacity:.3;pointer-events:none}
.bar .next{background:var(--ink);color:#fff;border:0;font-family:var(--display);font-size:clamp(1.6rem,3vw,2.6rem);letter-spacing:-.04em;text-transform:none;min-height:96px;padding:0 28px}
.bar .next:hover{background:#000;padding-left:36px}
.bar .next .ar{color:var(--accent)}
.tools{display:flex;gap:0;flex-wrap:wrap;margin-top:24px}
.tools button{min-height:48px;padding:0 16px;border:1px solid var(--ink);margin:0 -1px -1px 0;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.tools button:hover{background:var(--paper)}
.tools button[aria-pressed="true"]{background:var(--ink);color:#fff}
.count{position:fixed;inset:0;z-index:70;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--ink)}
.count .n{font-family:var(--display);font-weight:700;font-size:min(60vw,26rem);line-height:.8;letter-spacing:-.08em}

/* QUIZ */
.q-main{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:clamp(20px,4vw,48px) 0 32px;position:relative}
.q-prompt{grid-column:1/7;grid-row:1;min-width:0}
.q-prompt .big{font-size:clamp(5rem,15vw,14rem);overflow-wrap:anywhere;line-height:.85;margin:16px 0 12px}
.q-prompt .big.long{font-size:clamp(3.6rem,9vw,9rem)}
.q-prompt .sub{font-weight:800;font-size:1.05rem}
.q-ans{grid-column:7/13;grid-row:1;position:relative;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.q-ans .acc-bar{height:14px;background:var(--accent);margin-right:calc(-1 * var(--pad));margin-bottom:24px}
.field{display:flex;flex-direction:column;gap:8px}
.field input{width:100%;min-height:76px;background:var(--paper);border:0;border-bottom:3px solid var(--ink);padding:0 16px;font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,3.4vw,3rem);letter-spacing:-.04em;border-radius:0}
.field input::placeholder{color:#a9a9a5}
.field input:disabled{background:var(--surface)}
.helpers{display:flex;flex-wrap:wrap;margin-top:12px}
.helpers button{min-width:56px;min-height:48px;border:1px solid var(--ink);margin:0 -1px -1px 0;font-family:var(--display);font-weight:700;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center}
.helpers button:hover{background:var(--paper)}
.helpers .micro{align-self:center;margin-right:14px}
.mc{border-top:1px solid var(--ink)}
.mc button{display:grid;grid-template-columns:56px 1fr 28px;align-items:center;gap:8px;width:100%;min-height:72px;border-bottom:1px solid var(--ink);padding:0 4px;transition:background .12s,padding .12s}
.mc button:hover{background:var(--surface);padding-left:12px}
.mc .i{font-weight:800;font-size:.8rem;letter-spacing:.12em}
.mc .o{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,2.8vw,2.4rem);letter-spacing:-.04em}
.mc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mc button[aria-pressed="true"] .m::before{content:"■";color:var(--accent)}
.mc button.right{box-shadow:inset 8px 0 0 var(--success)}
.mc button.wrong{box-shadow:inset 8px 0 0 var(--error)}
.mc button.dim{opacity:.5}
.qtools{display:flex;gap:0;margin-top:20px;flex-wrap:wrap}
.qtools button{min-height:52px;padding:0 20px;border:1px solid var(--ink);margin:0 -1px -1px 0;font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;transition:background .12s}
.qtools button.pri{background:var(--accent);flex:1;justify-content:space-between}
.qtools button.pri:hover{background:var(--accent-hover)}
.qtools button:hover{background:var(--paper)}
.qtools button[disabled]{opacity:.3;pointer-events:none}
.hint{margin-top:16px;border-left:6px solid var(--ink);padding:6px 0 6px 14px;font-weight:600}
.fb{margin-top:24px;border-top:2px solid var(--ink);padding-top:16px}
.fb .st{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.05em;line-height:1;display:flex;align-items:center;gap:14px}
.fb .st .ic{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;font-family:var(--body);font-weight:800}
.fb.ok .ic{background:var(--success)}.fb.no .ic{background:var(--error)}.fb.skip .ic{background:var(--muted)}
.fb dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:0 18px}
.fb dt,.fb dd{padding:9px 0;border-top:1px solid var(--line);margin:0}
.fb dd{font-weight:700}
.fb p{margin:12px 0 0;color:#333;max-width:60ch}
.ghostnum{position:absolute;right:calc(-1 * var(--pad));top:-4px;pointer-events:none}

/* RESULTS */
.res{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:clamp(16px,3vw,40px) var(--pad) 60px}
.res .num{grid-column:1/8;min-width:0}
.res .num .display{font-size:clamp(7rem,24vw,24rem);line-height:.8;margin:18px 0 0}
.res .num .display small{font-size:.38em;letter-spacing:-.04em}
.res .mx{grid-column:8/13;align-self:end}
.mrow{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding:14px 0}
.mrow:last-child{border-bottom:1px solid var(--ink)}
.mrow b{font-family:var(--display);font-weight:700;font-size:1.8rem;letter-spacing:-.04em}
.res .ctas{grid-column:1/13;display:grid;grid-template-columns:2fr 1fr 1fr;gap:0;margin:40px 0 0}
.res .ctas .btn{min-height:84px;justify-content:space-between}
.review{grid-column:1/13;margin-top:56px}
.review h2{font-size:clamp(2.4rem,5vw,5rem);margin:0 0 24px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:10px 12px 10px 0;border-bottom:2px solid var(--ink)}
.tbl td{padding:14px 12px 14px 0;border-bottom:1px solid var(--line);vertical-align:top;font-weight:600}
.tbl td.st{font-weight:800;white-space:nowrap}
.tag{display:inline-block;min-width:92px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid currentColor}
.tag.ok{color:var(--success)}.tag.no{color:var(--error)}.tag.sk{color:var(--muted)}

/* LISTS */
.page{padding:clamp(12px,3vw,40px) var(--pad) 80px}
.page h1{font-size:clamp(3.6rem,9vw,9.5rem);margin:16px 0 36px}
.empty{border-top:2px solid var(--ink);padding:40px 0;display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.empty .display{grid-column:1/9;font-size:clamp(3rem,8vw,8rem)}
.empty p{grid-column:1/9;margin:0;max-width:46ch}
.empty .btn{grid-column:1/9;justify-self:start}
.lrow{display:grid;grid-template-columns:64px 1.2fr 1fr auto;gap:16px;align-items:center;border-top:1px solid var(--ink);padding:16px 0;min-height:76px}
.lrow:last-child{border-bottom:1px solid var(--ink)}
.lrow .t{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.6rem);letter-spacing:-.05em;line-height:1}
.lrow .x{min-height:44px;padding:0 14px;border:1px solid var(--ink);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.lrow .x:hover{background:var(--ink);color:#fff}
.prog{height:12px;background:var(--line);position:relative;margin-top:6px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.prog i.lo{background:var(--accent)}

/* TABLET */
@media (max-width:1199px){
  .hero .blurb{max-width:34%}
  .cfg-head{grid-column:1/13;position:static}
  .cfg-head h1{font-size:clamp(3.6rem,13vw,8rem)}
  .cfg-body{grid-column:1/13;margin-top:32px}
  .cfg-sum{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
  .start{min-height:96px;margin-top:20px}
  .rows .lead{grid-column:1/13;margin-bottom:28px}.rows .list{grid-column:1/13}
}
@media (max-width:899px){
  .s-left{grid-column:1/13}
  .s-right{grid-column:1/13;grid-row:2;min-height:300px;margin-top:8px}
  .s-right .acc-block{left:0}
  .vlab{display:none}
  .q-prompt{grid-column:1/13}
  .q-ans{grid-column:1/13;grid-row:2;margin-top:24px}
  .res .num,.res .mx{grid-column:1/13}
  .res .mx{margin-top:32px}
  .res .ctas{grid-template-columns:1fr}
  .grp-c{padding-left:0}
}
/* MOBILE */
@media (max-width:720px){
  :root{--top-h:64px}
  .top .nl,.top .hide-m{display:none}
  .menu-btn{display:inline-flex}
  .top{padding-top:calc(8px + env(safe-area-inset-top))}
  .hero{min-height:0;display:flex;flex-direction:column}
  .hero .stage{position:relative;height:min(122vw,560px);overflow:hidden}
  .hero .wordmark{top:2%;font-size:clamp(5.6rem,26vw,9rem)}
  .hero .acc-block{left:26%;top:56%;height:36%}
  .hero .art{left:38%;width:56%;top:27%;height:90%}
  .hero .vtext{right:var(--pad);top:4%}
  .hero .vtext i{height:56px}
  .hero .vtext .vert{font-size:.78rem}
  .hero .blurb{display:none}
  .hero .num{left:var(--pad);bottom:20px;font-size:4rem}
  .hero .acc-block .go{left:auto;right:0}
  .hero .actions{position:static;width:auto;padding:24px var(--pad) 8px}
  .act{min-height:68px}
  .rrow{grid-template-columns:44px 1fr 28px;gap:10px}
  .rrow p{grid-column:2/4}
  .rrow .ar{grid-row:1;grid-column:3}
  .grp-h{grid-template-columns:40px 1fr 28px}
  .grp-h .v{grid-column:2/3;grid-row:2;text-align:left;font-size:.68rem}
  .grp-h .pm{grid-row:1;grid-column:3}
  .setting{grid-template-columns:1fr;gap:8px}
  .setting .lab{padding-top:0}
  .keys{grid-template-columns:repeat(4,1fr)}
  .keys button.rnd{grid-column:span 4}
  .degs button{min-height:68px}
  .degs .c{font-size:.62rem}
  .degs .r{font-size:1.05rem}

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top" id="top"></header>
<main id="main" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<div id="overlay"></div>

<script>
/* ============================================================
   MUSIC ENGINE  — spelled diatonic chords (prototype port)
   ============================================================ */
const LET=['C','D','E','F','G','A','B'], LPC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],harmonic:[0,2,3,5,7,8,11]};
const SCALE_NAME={major:'Major',minor:'Natural minor',harmonic:'Harmonic minor'};
const ROMAN=['I','II','III','IV','V','VI','VII'];
const mod=(n,m)=>((n%m)+m)%m;
const accStr=a=>a>0?'♯'.repeat(a):a<0?'♭'.repeat(-a):'';
const noteStr=n=>n.letter+accStr(n.acc);
function parseTonic(s){const m=/^([A-G])([#b]*)$/.exec(s);const acc=[...m[2]].reduce((a,c)=>a+(c==='#'?1:-1),0);return{letter:m[1],acc,pc:mod(LPC[m[1]]+acc,12)}}
function spell(li,pc){const letter=LET[mod(li,7)];const d=mod(pc-LPC[letter]+6,12)-6;return{letter,acc:d,pc}}
function buildScale(tonic,type){const t=parseTonic(tonic),ti=LET.indexOf(t.letter);return SCALES[type].map((iv,i)=>spell(ti+i,mod(t.pc+iv,12)))}
const QUAL={ // suffix display, roman suffix
  maj:['',''],min:['m',''],dim:['dim','°'],aug:['aug','+'],
  maj7:['maj7','maj7'],dom7:['7','7'],m7:['m7','7'],mMaj7:['m(maj7)','(maj7)'],m7b5:['m7♭5','ø7'],dim7:['dim7','°7'],augMaj7:['maj7♯5','+maj7']};
const QUAL_WORD={maj:'major',min:'minor',dim:'diminished',aug:'augmented',maj7:'major seventh',dom7:'dominant seventh',m7:'minor seventh',mMaj7:'minor-major seventh',m7b5:'half-diminished seventh',dim7:'diminished seventh',augMaj7:'augmented major seventh'};
function buildChord(tonic,type,degree,kind,inv=0){
  const sc=buildScale(tonic,type),i=degree-1;
  const idx=kind==='seventh'?[0,2,4,6]:[0,2,4];
  const notes=idx.map(k=>sc[(i+k)%7]);
  const rpc=notes[0].pc,iv=notes.map(n=>mod(n.pc-rpc,12));
  let q;
  const tri=iv[1]===4&&iv[2]===7?'maj':iv[1]===3&&iv[2]===7?'min':iv[1]===3&&iv[2]===6?'dim':iv[1]===4&&iv[2]===8?'aug':'?';
  if(kind==='triad')q=tri;else{
    const s=iv[3];
    q={maj:{11:'maj7',10:'dom7'},min:{10:'m7',11:'mMaj7'},dim:{10:'m7b5',9:'dim7'},aug:{11:'augMaj7',10:'dom7'}}[tri]?.[s]||'?';}
  const upper=['maj','aug','maj7','dom7','augMaj7'].includes(q);
  let rn=ROMAN[i];if(!upper)rn=rn.toLowerCase();
  const rnSuf=QUAL[q][1];
  const order=notes.map((_,k)=>notes[(k+inv)%notes.length]);
  const bass=order[0];
  const name=noteStr(notes[0])+QUAL[q][0]+(inv?'/'+noteStr(bass):'');
  return{degree,kind,key:tonic,type,q,root:notes[0],notes,order,bass,inv,name,plain:noteStr(notes[0])+QUAL[q][0],
    roman:rn+rnSuf,romanBase:rn,word:QUAL_WORD[q],pcs:notes.map(n=>n.pc)};
}
function keyLabel(t,type){return noteStr(parseTonic(t))+' '+SCALE_NAME[type].toLowerCase()}
function fmtAcc(s){return String(s).replace(/[♯♭]+/g,m=>`<span class="acc">${m}</span>`)}
function romanHTML(r){const m=/^([IiVv]+)(.*)$/.exec(r);return m[2]?`<span class="rn">${m[1]}<sup>${fmtAcc(m[2])}</sup></span>`:`<span class="rn">${m[1]}</span>`}

/* typed-answer parsing & grading */
const SUF_TRIAD={'':'maj','maj':'maj','m':'min','dim':'dim','aug':'aug','+':'aug'};
const SUF_SEV={'maj7':'maj7','7':'dom7','m7':'m7','mmaj7':'mMaj7','m7b5':'m7b5','m7-5':'m7b5','dim7':'dim7','maj7#5':'augMaj7','+maj7':'augMaj7','augmaj7':'augMaj7','maj7+5':'augMaj7'};
function parseChord(raw,kind){
  let s=raw.trim().replace(/♯/g,'#').replace(/♭/g,'b').replace(/Δ/g,'maj').replace(/ø7?/gi,'m7b5').replace(/[°o](?=7|$)/g,'dim').replace(/º/g,'dim');
  const m=/^([A-Ga-g])(#{1,2}|b{1,2})?(.*)$/.exec(s);if(!m)return null;
  const letter=m[1].toUpperCase(),acc=m[2]?[...m[2]].reduce((a,c)=>a+(c==='#'?1:-1),0):0;
  let suf=m[3].replace(/[\s()]/g,'').replace(/^mM(?!in)/,'mmaj').replace(/^M(?!in|aj)/,'maj').toLowerCase().replace(/^min(or)?/,'m').replace(/^-/,'m').replace(/^major/,'maj').replace(/^dom/,'');
  if(suf==='-7')suf='m7';
  const map=kind==='seventh'?SUF_SEV:SUF_TRIAD;
  const q=map[suf];if(!q)return{pc:mod(LPC[letter]+acc,12),q:null,suf};
  return{pc:mod(LPC[letter]+acc,12),q,letter,acc};
}
function parseDegree(raw){
  const t=raw.toLowerCase().replace(/degree|th|st|nd|rd|\s/g,'');
  if(/^[1-7]$/.test(t))return +t;
  const m=/^(vii|vi|iv|v|iii|ii|i)/.exec(t);return m?ROMAN.map(r=>r.toLowerCase()).indexOf(m[1])+1:null;
}

/* ============================================================
   STATE / PERSISTENCE
   ============================================================ */
const DEF={
  trainer:{key:'C',scale:'major',set:'both',degrees:[1,2,3,4,5,6,7],inv:'root',prog:'manual',interval:4,countdown:3,showNotes:'always',diagram:true,randEvery:6},
  quiz:{key:'G',scale:'major',set:'triad',degrees:[1,2,3,4,5,6,7],dir:'both',mode:'typed',count:10,hints:true,showKey:true}
};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem('chordlab.'+k));return v?{...d,...v}:{...d}}catch(e){return{...d}}};
const save=(k,v)=>{try{localStorage.setItem('chordlab.'+k,JSON.stringify(v))}catch(e){}};
const S={view:'home',cfg:{trainer:load('trainer',DEF.trainer),quiz:load('quiz',DEF.quiz)},open:{trainer:{1:true},quiz:{1:true}},
  bookmarks:load('bm',{list:[]}).list||[],stats:load('stats',{deg:{}}),T:null,Q:null,R:null,menu:false,lastCfg:'trainer'};
const $=s=>document.querySelector(s),main=$('#main');
const live=m=>{$('#live').textContent='';setTimeout(()=>$('#live').textContent=m,30)};
const KEYS=['C','C#','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B'];
const pad2=n=>String(n).padStart(2,'0');
const fmtT=ms=>{const s=Math.floor(ms/1000);return pad2(Math.floor(s/60))+':'+pad2(s%60)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const randKey=()=>KEYS[Math.floor(Math.random()*KEYS.length)];
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ============================================================
   NAV
   ============================================================ */
const NAV=[['trainer','Train'],['quiz','Quiz'],['collections','Collections'],['progress','Progress']];
function activeNav(){const v=S.view;if(v==='cfg-trainer'||v==='trainer-run')return'trainer';if(v==='cfg-quiz'||v==='quiz-run')return'quiz';if(v==='results')return S.R?.mode==='trainer'?'trainer':'quiz';return v}
function renderTop(){
  const a=activeNav();
  const link=(id,l)=>`<button class="nl micro" data-go="${id}" ${a===id?'aria-current="page"':''}>${l}</button>`;
  $('#top').innerHTML=`<div class="ngrp"><button class="mark" data-go="home" aria-label="chord. home">♯1</button>${link('trainer','Train')}${link('quiz','Quiz')}</div>
  <div class="ngrp">${link('collections','Collections')}${link('progress','Progress')}<button class="nl micro" data-go="settings">Settings</button><button class="menu-btn" data-menu="1" aria-label="Open menu" aria-expanded="false"><i></i></button></div>`;
}
function renderMenu(){
  const o=$('#overlay');
  if(!S.menu){o.innerHTML='';return}
  const items=[['home','Home','00'],...NAV.map((n,i)=>[n[0],n[1],pad2(i+1)]),['settings','Settings','05']];
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Menu"><div class="row-top"><span class="mark">♯1</span><button class="micro" data-menu="0" style="min-height:44px;padding:0 4px" id="menuClose">Close ✕</button></div>
  <nav>${items.map(i=>`<button data-go="${i[0]}"><span>${i[1].toLowerCase()}.</span><span class="micro">${i[2]}</span></button>`).join('')}</nav>
  <div style="margin-top:auto" class="micro muted">Chord training · offline-first prototype</div></div>`;
  $('#menuClose').focus();
}

/* ============================================================
   VIEW: HOME
   ============================================================ */
function artSVG(){ // original abstract keyboard "subject": chord tones (C-E-G) rise above the rest
  const w=60,keys=7;let s='';
  const tops=[30,230,0,230,90,230,230];
  for(let i=0;i<keys;i++){const raised=[0,2,4].includes(i);
    s+=`<rect x="${i*w+1.5}" y="${tops[i]}" width="${w-3}" height="${1000-tops[i]}" fill="${raised?'#111':'#fff'}" stroke="#111" stroke-width="2.5"/>`}
  [0,1,3,4,5].forEach(i=>{if([0,2,4].includes(i)||[0,2,4].includes(i+1))s+=`<rect x="${(i+1)*w-13}" y="230" width="26" height="250" fill="#111" stroke="${[0,2,4].includes(i)||[0,2,4].includes(i+1)?'#fff':'#111'}" stroke-width="1.5"/>`});
  [0,2,4].forEach(i=>{s+=`<rect x="${i*w+17}" y="${tops[i]+16}" width="26" height="5" fill="#fff"/>`});
  return`<svg viewBox="0 0 420 1000" preserveAspectRatio="xMidYMin slice" aria-hidden="true" focusable="false">${s}</svg>`;
}
function viewHome(){
  return`<div class="view">
  <section class="hero" aria-labelledby="h1">
   <div class="stage" id="stage">
    <h1 id="h1" class="display wordmark">chord.</h1>
    <div class="acc-block"><button class="sq go" data-go="trainer" aria-label="Start instrument trainer setup">→</button></div>
    <div class="art">${artSVG()}</div>
    <div class="blurb micro muted"><span>Diatonic chord practice for scale degrees, triads &amp; sevenths.</span><span>Silent. Offline-first. No accounts. Keep practising.</span></div>
    <div class="vtext" aria-hidden="true"><div class="vert">Diatonic<br>chord practice</div><i></i></div>
    <div class="num" aria-hidden="true">07</div>
   </div>
   <div class="actions">
    <button class="act" data-go="trainer"><span>Instrument trainer<small>Chords on screen. You play them.</small></span><span aria-hidden="true">→</span></button>
    <button class="act" data-go="quiz"><span>No-instrument quiz<small>Name the chord. Name the degree.</small></span><span aria-hidden="true">→</span></button>
   </div>
  </section>
  <section class="rows" aria-label="How it works">
   <div class="lead"><div class="micro muted">Edition 01 / Practice index</div><h2 class="display" style="font-size:clamp(2.6rem,5vw,5rem);margin-top:14px">three<br>movements.</h2></div>
   <div class="list">
    <button class="rrow" data-go="trainer"><span class="micro">01</span><span class="t">train</span><p>Chords arrive on a timer or on your command. Notes, inversion and a keyboard diagram support the hands.</p><span class="ar" aria-hidden="true">↗</span></button>
    <button class="rrow" data-go="quiz"><span class="micro">02</span><span class="t">test</span><p>Choose a key, then identify diatonic chords and degrees by typing or multiple choice.</p><span class="ar" aria-hidden="true">↗</span></button>
    <button class="rrow" data-go="progress"><span class="micro">03</span><span class="t">review</span><p>Weak degrees surface as thin bars. Bookmarked chords wait in your collection.</p><span class="ar" aria-hidden="true">↗</span></button>
   </div>
  </section>
  <footer class="foot"><span class="micro">Prototype 0.1 · HTML mock of the redesign</span><span class="micro muted">Type: Grotesk / Manrope · Accent #FF4B30</span></footer>
  </div>`;
}

/* ============================================================
   VIEW: CONFIG (trainer + quiz)
   ============================================================ */
function summary(mode){
  const c=S.cfg[mode];
  const key=c.key==='RANDOM'?'Random key':keyLabel(c.key,c.scale);
  const rows=[['Key / scale',key],['Chord set',{triad:'Triads',seventh:'Sevenths',both:'Triads + sevenths'}[c.set]],['Degrees',c.degrees.length===7?'All seven':c.degrees.map(d=>ROMAN[d-1]).join(' ')||'None']];
  if(mode==='trainer')rows.push(['Advance',c.prog==='manual'?'Manual · Next':`Auto · ${c.interval}s`]);
  else rows.push(['Questions',c.count+' · '+(c.mode==='typed'?'typed':'multiple choice')]);
  return rows;
}
function validate(mode){
  const c=S.cfg[mode];
  if(!c.degrees.length)return'Select at least one degree to start.';
  if(mode==='quiz'&&c.count<1)return'Choose at least one question.';
  return'';
}
function degButtons(mode){
  const c=S.cfg[mode];
  return[1,2,3,4,5,6,7].map(d=>{
    let label='';
    if(c.key!=='RANDOM'){const ch=buildChord(c.key,c.scale,d,c.set==='seventh'?'seventh':'triad');label=ch.plain}
    let rn;if(c.key!=='RANDOM'){const ch=buildChord(c.key,c.scale,d,c.set==='seventh'?'seventh':'triad');rn=ch.roman}else rn=ROMAN[d-1];
    const on=c.degrees.includes(d);
    return`<button data-fid="deg${d}" data-act="deg" data-v="${d}" aria-pressed="${on}" aria-label="Degree ${d}, ${rn}${label?' '+label:''}"><span class="r">${romanHTML(rn)}</span><span class="c">${label?fmtAcc(label):'&nbsp;'}</span></button>`}).join('');
}
function seg(prop,opts,mode){const c=S.cfg[mode];return`<div class="seg" role="group">${opts.map(o=>`<button data-fid="${prop}-${o[0]}" data-act="set" data-p="${prop}" data-v="${o[0]}" aria-pressed="${c[prop]===o[0]}">${o[1]}</button>`).join('')}</div>`}
function stepper(prop,min,max,unit,mode){const c=S.cfg[mode];return`<div class="stepper"><button data-fid="${prop}-m" data-act="step" data-p="${prop}" data-d="-1" data-min="${min}" data-max="${max}" aria-label="Decrease ${prop}">−</button><output aria-live="polite">${c[prop]}${unit}</output><button data-fid="${prop}-p" data-act="step" data-p="${prop}" data-d="1" data-min="${min}" data-max="${max}" aria-label="Increase ${prop}">+</button></div>`}
function keyPicker(mode){
  const c=S.cfg[mode];
  return`<div class="keys" role="group" aria-label="Key tonic">${KEYS.map(k=>`<button data-fid="key-${k}" data-act="set" data-p="key" data-v="${k}" aria-pressed="${c.key===k}" aria-label="${noteStr(parseTonic(k)).replace('♯',' sharp').replace('♭',' flat')}">${fmtAcc(noteStr(parseTonic(k)))}</button>`).join('')}
  <button class="rnd" data-fid="key-RANDOM" data-act="set" data-p="key" data-v="RANDOM" aria-pressed="${c.key==='RANDOM'}">Random key</button></div>`;
}
function grp(mode,n,title,val,body){
  const open=!!S.open[mode][n];
  return`<section class="grp"><button class="grp-h" data-fid="grp${n}" data-act="toggle" data-n="${n}" aria-expanded="${open}"><span class="micro">${pad2(n)}</span><span class="t">${title}</span><span class="micro muted v">${val}</span><span class="pm" aria-hidden="true">${open?'−':'+'}</span></button>${open?`<div class="grp-c">${body}</div>`:''}</section>`;
}
function viewCfg(mode){
  const c=S.cfg[mode],T=mode==='trainer';
  const sum=summary(mode),err=validate(mode);
  const keyTxt=c.key==='RANDOM'?'Random':keyLabel(c.key,c.scale);
  const mat=`<div class="setting"><div class="lab micro">Key<small>${T?'Independent of the quiz.':'Independent of the trainer. Drives every question.'}</small></div><div>${keyPicker(mode)}</div></div>
  <div class="setting"><div class="lab micro">Scale</div>${seg('scale',[['major','Major'],['minor','Natural minor'],['harmonic','Harmonic minor']],mode)}</div>
  <div class="setting"><div class="lab micro">Chord set</div>${seg('set',[['triad','Triads'],['seventh','Sevenths'],['both','Both']],mode)}</div>
  <div class="setting"><div class="lab micro">Degrees<small>Chord shown for the selected key.</small></div><div class="degs" role="group" aria-label="Scale degrees">${degButtons(mode)}</div></div>`
  +(T?`<div class="setting"><div class="lab micro">Inversions</div>${seg('inv',[['root','Root only'],['any','Any inversion']],mode)}</div>`:'');
  const flow=T?`<div class="setting"><div class="lab micro">Advance<small>Manual always keeps the Next button.</small></div>${seg('prog',[['manual','Manual'],['auto','Automatic']],mode)}</div>
   ${c.prog==='auto'?`<div class="setting"><div class="lab micro">Interval</div>${stepper('interval',1,20,'s',mode)}</div><div class="setting"><div class="lab micro">Start countdown</div>${seg('countdown',[[0,'Off'],[3,'3s'],[5,'5s']].map(x=>[x[0],x[1]]),mode)}</div>`:''}
   ${c.key==='RANDOM'?`<div class="setting"><div class="lab micro">Change key</div>${stepper('randEvery',2,24,' chords',mode)}</div>`:''}`
  :`<div class="setting"><div class="lab micro">Direction</div>${seg('dir',[['both','Both'],['d2c','Degree → chord'],['c2d','Chord → degree']],mode)}</div>
   <div class="setting"><div class="lab micro">Answer mode</div>${seg('mode',[['typed','Typed'],['mc','Multiple choice']],mode)}</div>
   <div class="setting"><div class="lab micro">Questions</div>${stepper('count',1,50,'',mode)}</div>`;
  const disp=T?`<div class="setting"><div class="lab micro">Notes</div>${seg('showNotes',[['always','Always shown'],['reveal','Hidden until reveal']],mode)}</div>
   <div class="setting"><div class="lab micro">Keyboard diagram</div>${seg('diagram',[[true,'On'],[false,'Off']],mode)}</div>`
  :`<div class="setting"><div class="lab micro">Hints</div>${seg('hints',[[true,'Allowed'],[false,'Off']],mode)}</div>
   <div class="setting"><div class="lab micro">Show key in quiz</div>${seg('showKey',[[true,'Yes'],[false,'No']],mode)}</div>`;
  return`<div class="view"><div class="cfg">
   <aside class="cfg-head">
     <div class="micro muted">Session ${T?'004':'005'} / ${T?'Instrument trainer':'No-instrument quiz'}</div>
     <h1 class="display">${T?'practice.':'configure.'}</h1>
     <div class="cfg-sum micro">${sum.map(r=>`<div><span class="muted">${r[0]}</span><b>${fmtAcc(esc(r[1]))}</b></div>`).join('')}</div>
     <div class="warn micro" role="alert" id="warn">${err}</div>
     <button class="start" data-act="start" data-fid="start" ${err?'disabled':''}><span class="micro">${T?'Trainer':'Quiz'} · ${fmtAcc(keyTxt)}</span><span class="big">start<br>session ↗</span></button>
   </aside>
   <div class="cfg-body">
     ${grp(mode,1,'Musical material',fmtAcc(keyTxt+' · '+({triad:'triads',seventh:'sevenths',both:'both'}[c.set])),mat)}
     ${grp(mode,2,'Session flow',T?(c.prog==='manual'?'Manual':'Auto '+c.interval+'s'):(c.mode==='typed'?'Typed':'Choice')+' · '+c.count+' Q',flow)}
     ${grp(mode,3,'Display',T?(c.showNotes==='always'?'Notes shown':'Notes on reveal'):(c.hints?'Hints on':'Hints off'),disp)}
   </div></div></div>`;
}

/* ============================================================
   PIANO DIAGRAM
   ============================================================ */
function pianoSVG(ch){
  // absolute semitone per chord tone, ascending from bass
  let prev=-1;const abs=ch.order.map((n,i)=>{let s=n.pc;if(i===0)prev=s;else{while(s<=prev)s+=12;prev=s}return s});
  const base=Math.floor(Math.min(...abs)/12)*12,span=Math.max(...abs)-base>=24?3:2,sel=new Map(abs.map((s,i)=>[s,ch.order[i]]));
  const W=26,H=190,BH=116,BW=17,WP=[0,2,4,5,7,9,11],BK=[0,1,3,4,5];
  let w='',b='',lab='';const n=span*7;
  for(let i=0;i<n;i++){const semi=base+Math.floor(i/7)*12+WP[i%7],on=sel.has(semi);
    w+=`<rect x="${i*W}" y="0" width="${W}" height="${H}" fill="${on?'#111':'#fff'}" stroke="#111" stroke-width="1.5"/>`;
    if(on){const bass=semi===abs[0];w+=`<text x="${i*W+W/2}" y="${H-14}" text-anchor="middle" font-family="Grotesk,sans-serif" font-weight="700" font-size="11" fill="#fff">${noteStr(sel.get(semi)).replace('♯','#').replace('♭','b')}</text>`;if(bass)w+=`<rect x="${i*W+W/2-4}" y="${H-38}" width="8" height="8" fill="#FF4B30"/>`}}
  for(let i=0;i<n;i++){if(!BK.includes(i%7))continue;const semi=base+Math.floor(i/7)*12+WP[i%7]+1,on=sel.has(semi);
    b+=`<rect x="${(i+1)*W-BW/2}" y="0" width="${BW}" height="${BH}" fill="${on?'#fff':'#111'}" stroke="#111" stroke-width="1.5"/>`;
    if(on)b+=`<text x="${(i+1)*W}" y="${BH-12}" text-anchor="middle" font-family="Grotesk,sans-serif" font-weight="700" font-size="9.5" fill="#111">${noteStr(sel.get(semi)).replace('♯','#').replace('♭','b')}</text>`;}
  return`<svg viewBox="0 0 ${n*W} ${H}" role="img" aria-label="Keyboard showing ${ch.order.map(noteStr).join(', ')}, bass ${noteStr(ch.bass)}">${w}${b}</svg>`;
}

function newTChord(){
  const T=S.T,c=T.cfg;
  if(c.key==='RANDOM'&&(!T.curKey||T.inKey>=c.randEvery)){T.curKey=randKey();T.inKey=0}
  const key=c.key==='RANDOM'?T.curKey:c.key;T.inKey++;
  const kind=c.set==='both'?pick(['triad','seventh']):c.set;
  let d=pick(c.degrees);if(T.chords.length&&c.degrees.length>1){let g=0;while(d===T.chords[T.chords.length-1].degree&&g++<8)d=pick(c.degrees)}
  const inv=c.inv==='any'?Math.floor(Math.random()*(kind==='seventh'?4:3)):0;
  return buildChord(key,c.scale,d,kind,inv);
}
function startTrainer(){
  const cfg={...S.cfg.trainer};save('trainer',cfg);
  S.T={cfg,chords:[],idx:-1,elapsed:0,chordMs:0,paused:false,countdown:cfg.prog==='auto'?cfg.countdown:0,revealed:false,last:performance.now(),curKey:null,inKey:0,bm:0};
  S.T.chords.push(newTChord());S.T.idx=0;
  S.view='trainer-run';render();
  if(S.T.countdown>0)runCountdown();else startTick();
}
let tickH=null,cdH=null;
function runCountdown(){
  let n=S.T.countdown;const o=$('#overlay');
  const show=()=>{o.innerHTML=`<div class="count" role="status" aria-label="Starting in ${n}"><div class="micro">Starting in</div><div class="n tnum">${n}</div><button class="btn" style="margin-top:32px" data-act="skipcd">Skip countdown</button></div>`};
  show();clearInterval(cdH);
  cdH=setInterval(()=>{n--;if(n<=0){clearInterval(cdH);o.innerHTML='';S.T.last=performance.now();startTick()}else show()},1000);
}
function startTick(){clearInterval(tickH);S.T.last=performance.now();tickH=setInterval(tickT,100)}
function tickT(){
  const T=S.T;if(!T||S.view!=='trainer-run'){clearInterval(tickH);return}
  const now=performance.now(),dt=now-T.last;T.last=now;if(T.paused)return;

}
function trainerNext(){const T=S.T;if(T.idx===T.chords.length-1)T.chords.push(newTChord());T.idx++;T.chordMs=0;T.revealed=false;renderMainOnly();announceChord()}
function trainerPrev(){const T=S.T;if(T.idx>0){T.idx--;T.chordMs=0;T.revealed=false;renderMainOnly()}}
function announceChord(){const c=S.T.chords[S.T.idx];live(`${c.name.replace('♯',' sharp').replace('♭',' flat')}, ${c.roman}`)}

/* ============================================================
   QUIZ SESSION
   ============================================================ */
function makeQ(cfg,prevKey){
  const key=cfg.key==='RANDOM'?randKey():cfg.key;
  const kind=cfg.set==='both'?pick(['triad','seventh']):cfg.set;
  const deg=pick(cfg.degrees);
  const dir=cfg.dir==='both'?pick(['d2c','c2d']):cfg.dir;
  const ch=buildChord(key,cfg.scale,deg,kind);
  const all=[1,2,3,4,5,6,7].map(d=>buildChord(key,cfg.scale,d,kind));
  const others=all.filter(x=>x.degree!==deg);
  let opts=null;
  if(cfg.mode==='mc'){
    const pool=dir==='d2c'?others.map(o=>o.name):others.map(o=>o.roman);
    const correct=dir==='d2c'?ch.name:ch.roman;
    const uniq=[...new Set(pool.filter(p=>p!==correct))].sort(()=>Math.random()-.5).slice(0,3);
    opts=[...uniq,correct].sort(()=>Math.random()-.5);
  }
  return{key,type:cfg.scale,kind,deg,dir,ch,opts,
    expected:dir==='d2c'?ch.name:`${ch.roman} · ${deg}`,
    hint:dir==='d2c'?`Degree ${deg} of ${keyLabel(key,cfg.scale)} is ${noteStr(ch.root)}. The chord built on it is ${ch.word}.`:`${noteStr(ch.root)} is the ${['1st','2nd','3rd','4th','5th','6th','7th'][deg-1]} note of ${keyLabel(key,cfg.scale)}.`};
}
function startQuiz(){
  const cfg={...S.cfg.quiz};save('quiz',cfg);
  const qs=[];for(let i=0;i<cfg.count;i++){let q,g=0;do{q=makeQ(cfg)}while(qs.length&&g++<10&&q.deg===qs[qs.length-1].deg&&q.dir===qs[qs.length-1].dir&&cfg.degrees.length>1);qs.push(q)}
  S.Q={cfg,qs,i:0,log:[],phase:'ask',sel:null,typed:'',hint:false,hints:0,start:performance.now(),qStart:performance.now(),res:null};
  S.view='quiz-run';render();setTimeout(()=>{const f=$('#ans');f&&f.focus()},60);
}
function gradeQ(q,raw){
  if(q.dir==='d2c'){
    const exp=parseChord(q.ch.name.replace(/\/.*$/,''),q.kind),got=parseChord(raw,q.kind);
    if(!got)return{ok:false,msg:'We could not read that as a chord. Try a root like C, F♯ or B♭ plus a quality.'};
    if(got.q===null)return{ok:false,msg:'Unrecognised chord quality. Examples: m, dim, aug, maj7, 7, m7, m7♭5.'};
    if(got.pc===exp.pc&&got.q===exp.q){
      const spellOk=(got.letter===q.ch.root.letter&&got.acc===q.ch.root.acc);
      return{ok:true,msg:spellOk?'':`Accepted as an enharmonic spelling. Theoretical spelling in this key: ${q.ch.name}.`};}
    if(got.pc===exp.pc)return{ok:false,msg:`Right root, wrong quality. This is a ${q.ch.word} chord.`};
    return{ok:false,msg:`The root of degree ${q.deg} is ${noteStr(q.ch.root)}.`};
  }
  const d=parseDegree(raw);
  if(d===null)return{ok:false,msg:'Answer with a degree number (1–7) or a Roman numeral.'};
  return d===q.deg?{ok:true,msg:''}:{ok:false,msg:`${q.ch.name} sits on degree ${q.deg}, not ${d}.`};
}
function submitQ(){
  const Q=S.Q,q=Q.qs[Q.i];if(Q.phase!=='ask')return;
  let raw=Q.sel!==null?Q.sel:Q.typed;if(!String(raw).trim()){live('Enter an answer first.');const f=$('#ans');f&&f.focus();return}
  let r;
  if(Q.cfg.mode==='mc'){const correct=q.dir==='d2c'?q.ch.name:q.ch.roman;r={ok:raw===correct,msg:raw===correct?'':'Look at the interval stack again.'}}
  else r=gradeQ(q,raw);
  Q.res={...r,answer:raw,skipped:false};Q.phase='fb';Q.log.push({q,answer:raw,ok:r.ok,skipped:false,hint:Q.hint,ms:performance.now()-Q.qStart});
  recordStat(q,r.ok);render();live((r.ok?'Correct. ':'Not quite. ')+'Expected '+q.expected.replace('♯',' sharp').replace('♭',' flat'));
  setTimeout(()=>{const n=$('[data-act="qnext"]');n&&n.focus()},40);
}
function skipQ(){const Q=S.Q,q=Q.qs[Q.i];if(Q.phase!=='ask')return;
  Q.res={ok:false,skipped:true,answer:'',msg:''};Q.phase='fb';Q.log.push({q,answer:'',ok:false,skipped:true,hint:Q.hint,ms:performance.now()-Q.qStart});recordStat(q,false);render();setTimeout(()=>{const n=$('[data-act="qnext"]');n&&n.focus()},40);live('Skipped. Expected '+q.expected)}
function recordStat(q,ok){const d=S.stats.deg;const k=q.deg;d[k]=d[k]||{c:0,t:0};d[k].t++;if(ok)d[k].c++;save('stats',S.stats)}
function nextQ(){const Q=S.Q;if(Q.phase!=='fb')return;
  if(Q.i>=Q.qs.length-1){finishQuiz();return}
  Q.i++;Q.phase='ask';Q.sel=null;Q.typed='';Q.hint=false;Q.res=null;Q.qStart=performance.now();render();setTimeout(()=>{const f=$('#ans');f&&f.focus()},40)}
function finishQuiz(){const Q=S.Q;S.R={mode:'quiz',log:Q.log,total:Q.qs.length,time:performance.now()-Q.start,cfg:Q.cfg};S.view='results';render()}

  return`<div class="view sess">

  return`<div class="view page"><div class="micro muted">Mastery / by degree</div><h1 class="display">${has?'progress.':'no data yet.'}</h1>
  ${has?[1,2,3,4,5,6,7].map(k=>{const s=d[k]||{c:0,t:0},p=s.t?Math.round(s.c/s.t*100):0;
   return`<div class="lrow"><span class="micro">${pad2(k)}</span><span class="t">${ROMAN[k-1]}</span><span class="mid"><span class="micro">${s.t?`${p}% · ${s.c} of ${s.t}`:'Not practised'} ${s.t&&p<60?'· needs review':s.t&&p>=90&&s.t>=4?'· mastered':''}</span><div class="prog" role="img" aria-label="${p} percent"><i class="${p<60?'lo':''}" style="width:${p}%"></i></div></span><span></span></div>`}).join('')
  :`<div class="empty"><p>Finish a quiz session and each scale degree will show up here as a thin bar with an accessible status label.</p><button class="btn acc-bg big" data-go="quiz"><span>Open quiz</span><span>↗</span></button></div>`}</div>`;
}

/* ============================================================
   RENDER / ROUTER / EVENTS
   ============================================================ */
function html(){
  switch(S.view){
    case'home':return viewHome();case'cfg-trainer':return viewCfg('trainer');case'cfg-quiz':return viewCfg('quiz');
    case'trainer-run':return viewTrainer();case'quiz-run':return viewQuiz();case'results':return viewResults();
    case'collections':return viewCollections();case'progress':return viewProgress();}
}
function render(focusId){
  const fid=focusId||(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.fid);
  const sy=window.scrollY;
  main.innerHTML=html();renderTop();renderMenu();
  if(fid){const el=document.querySelector(`[data-fid="${fid}"]`);if(el)el.focus({preventScroll:true})}
}
function renderMainOnly(){const fid=document.activeElement?.dataset?.fid;const st=window.scrollY;const v=main.querySelector('.view');if(v)v.style.animation='none';main.innerHTML=html();const v2=main.querySelector('.view');if(v2)v2.style.animation='none';window.scrollTo(0,st);if(fid){const el=document.querySelector(`[data-fid="${fid}"]`);if(el&&!el.disabled)el.focus({preventScroll:true})}}
function go(v){
  clearInterval(tickH);clearInterval(cdH);$('#overlay').innerHTML='';S.menu=false;
  if(v==='trainer'){v='cfg-trainer'}if(v==='quiz'){v='cfg-quiz'}
  if(v==='settings')v='cfg-'+S.lastCfg;
  if(v.startsWith('cfg-'))S.lastCfg=v.slice(4);
  S.view=v;render();window.scrollTo(0,0);main.focus({preventScroll:true});
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const m=e.target.closest('[data-menu]');if(m){S.menu=m.dataset.menu==='1';renderMenu();if(!S.menu){const b=document.querySelector('.menu-btn');b&&b.focus()}return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=S.view,mode=v==='cfg-trainer'?'trainer':'quiz';
  switch(act){
   case'toggle':{const n=+a.dataset.n,o=S.open[mode];o[n]=!o[n];render();break}
   case'set':{const p=a.dataset.p;let val=a.dataset.v;if(val==='true')val=true;else if(val==='false')val=false;else if(/^\d+$/.test(val))val=+val;S.cfg[mode][p]=val;save(mode,S.cfg[mode]);render();break}
   case'deg':{const d=+a.dataset.v,c=S.cfg[mode];c.degrees=c.degrees.includes(d)?c.degrees.filter(x=>x!==d):[...c.degrees,d].sort();save(mode,c);render();break}
   case'step':{const c=S.cfg[mode],p=a.dataset.p;c[p]=Math.max(+a.dataset.min,Math.min(+a.dataset.max,c[p]+ +a.dataset.d));save(mode,c);render();break}
   case'start':mode==='trainer'?startTrainer():startQuiz();break;
   case'skipcd':clearInterval(cdH);$('#overlay').innerHTML='';startTick();break;
   case'next':trainerNext();break;
   case'prev':trainerPrev();break;
   case'pause':S.T.paused=!S.T.paused;S.T.last=performance.now();renderMainOnly();live(S.T.paused?'Paused':'Resumed');break;
   case'reveal':S.T.revealed=!S.T.revealed;renderMainOnly();break;
   case'bm':{const c=S.T.chords[S.T.idx],i=S.bookmarks.findIndex(b=>b.name===c.name&&b.key===c.key&&b.type===c.type);
     if(i>=0)S.bookmarks.splice(i,1);else S.bookmarks.push({name:c.name,key:c.key,type:c.type,roman:c.roman});save('bm',{list:S.bookmarks});renderMainOnly();live(i>=0?'Bookmark removed':'Chord bookmarked');break}
   case'rmbm':S.bookmarks.splice(+a.dataset.i,1);save('bm',{list:S.bookmarks});render();break;
   case'finish':finishTrainer();break;
   case'again':S.R.mode==='trainer'?startTrainer():startQuiz();break;
   case'retrywrong':{const wrong=S.R.log.filter(l=>!l.ok).map(l=>l.q);if(!wrong.length)break;S.Q={cfg:S.R.cfg,qs:wrong,i:0,log:[],phase:'ask',sel:null,typed:'',hint:false,hints:0,start:performance.now(),qStart:performance.now(),res:null};S.view='quiz-run';render();setTimeout(()=>{const f=$('#ans');f&&f.focus()},60);break}
   case'ins':{const f=$('#ans');if(f){const s=f.selectionStart??f.value.length;f.value=f.value.slice(0,s)+a.dataset.v+f.value.slice(f.selectionEnd??s);S.Q.typed=f.value;f.focus();f.setSelectionRange(s+1,s+1)}break}
   case'opt':S.Q.sel=a.dataset.v;render('o'+[...a.parentNode.children].indexOf(a));break;
   case'submit':submitQ();break;
   case'hint':if(S.Q.phase==='ask'&&!S.Q.hint){S.Q.hint=true;S.Q.hints++;render('hint')}break;
   case'skip':skipQ();break;
   case'qnext':nextQ();break;
   case'quit':if(S.Q.log.length)finishQuiz();else go('cfg-quiz');break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='ans'&&S.Q)S.Q.typed=e.target.value});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.menu){S.menu=false;renderMenu();return}
  if(S.view==='quiz-run'){
    const Q=S.Q;
    if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();submitQ()}
    if(Q.cfg.mode==='mc'&&Q.phase==='ask'&&/^[1-4]$/.test(e.key)&&e.target.tagName!=='INPUT'){const o=Q.qs[Q.i].opts[+e.key-1];if(o){Q.sel=o;render('o'+(+e.key-1))}}
  }
  if(S.view==='trainer-run'&&e.target.tagName!=='INPUT'&&!S.menu){if(e.key==='ArrowRight'){trainerNext()}if(e.key==='ArrowLeft'){trainerPrev()}}
});
(function init(){
  const h=(location.hash||'').slice(1);
  S.view=['home','cfg-trainer','cfg-quiz','collections','progress'].includes(h)?h:'home';
  render();
})();
</script>
</body>
</html>
